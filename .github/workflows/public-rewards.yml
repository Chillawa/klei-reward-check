name: Publish public rewards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions: {}

concurrency:
  group: public-rewards-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PUBLISH_PUBLIC_REWARDS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: publisher/requirements.txt
      - uses: actions/configure-pages@v5
      - run: python -m pip install -r publisher/requirements.txt
      - name: Generate the public feed
        run: |
          mkdir -p site
          python publisher/public_feed.py --output site/rewards.json
          chmod 644 site/rewards.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.links.outputs.feed_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Show the public feed link
        id: links
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "feed_url=${PAGES_URL%/}/rewards.json" >> "$GITHUB_OUTPUT"
          echo "[查看公开清单](${PAGES_URL%/}/rewards.json)" >> "$GITHUB_STEP_SUMMARY"
